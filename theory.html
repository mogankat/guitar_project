// CARDS
// ════════════════════════════════════════════════════════════════
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const playBtn = (act, label, extra = '') => `<button type="button" class="play" data-act="${act}" ${extra} aria-label="${esc(label)}" title="${esc(label)}"></button>`;
const fbIcon = (href, what) => `<a class="fb-ico" href="${href}" title="Show ${esc(what)} on the fretboard" aria-label="Show ${esc(what)} on the fretboard">&#8599;</a>`;
const chip = (n, i, cls = '', sub = '') => `<button type="button" class="chip ${cls}" data-note="${i}">${esc(n)}${sub ? `<small>${esc(sub)}</small>` : ''}</button>`;

let VIEW = { refs: [] };   // data behind the rendered cards, for the click handlers

function currentScale() {
  const t = tonic();
  const f = S.mode === 'major' ? FORMULAS.major : FORMULAS[S.minorType === 'natural' ? 'minor' : S.minorType];
  return { t, notes: build(t, f), formula: f };
}

function renderScale() {
  const { t, notes, formula } = currentScale();
  const title = S.mode === 'major' ? 'Major scale' : { natural: 'Natural minor scale', harmonic: 'Harmonic minor scale', melodic: 'Melodic minor scale (ascending)' }[S.minorType];
  const fbName = S.mode === 'major' ? 'Ionian' : { natural: 'Aeolian', harmonic: 'Harm Minor', melodic: 'Mel Minor' }[S.minorType];
  VIEW.scale = { t, notes };
  const rows = notes.map((n, i) => {
    let dn = DEGREE_NAMES[i];
    if (i === 6 && n.deg === 'b7') dn = 'Subtonic';
    return `<tr><td class="num">${n.deg.replace('b', '♭').replace('#', '♯')}</td><td>${chip(n.name, i, i === 0 ? 'root' : '')}</td>`
      + `<td>${dn}</td><td class="muted">${INTERVAL_NAMES[n.deg] || ''}</td></tr>`;
  }).join('');
  const semis = notes.map(n => n.semis).concat(12);
  const steps = semis.slice(1).map((s, i) => s - semis[i]).map(d => d === 1 ? '<span class="h">H</span>' : d === 2 ? '<span>W</span>' : '<span class="h">W+H</span>').join('');
  const minorSeg = S.mode === 'minor'
    ? `<div class="seg" role="radiogroup" aria-label="Minor scale type">${['natural', 'harmonic', 'melodic'].map(k =>
        `<button type="button" data-minor="${k}" class="${S.minorType === k ? 'active' : ''}" role="radio" aria-checked="${S.minorType === k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div>` : '';
  // Jumps to the relative key (same notes) and the parallel key (same tonic).
  const isMaj = S.mode === 'major';
  const rel = isMaj ? minorKeyAt(S.pos) : majorKeyAt(S.pos);
  VIEW.jump = { parPos: isMaj ? posOfMajorPc(pcOf(t) + 3) : posOfMajorPc(pcOf(t)) };
  const other = isMaj ? 'minor' : 'major';
  const jumps = `<div class="row small muted" style="margin:0 0 6px;gap:6px">Relative ${other}`
    + `<button type="button" class="chip" data-go="rel" title="Go to ${esc(keyName(rel, other))} (same notes)">${esc(nameOf(rel))}${isMaj ? 'm' : ''}</button>`
    + `<span style="margin-left:6px">Parallel ${other}</span>`
    + `<button type="button" class="chip" data-go="par" title="Go to ${esc(keyName(t, other))} (same tonic)">${esc(nameOf(t))}${isMaj ? 'm' : ''}</button></div>`;
  setCard('scale', 'Scale', minorSeg,
    `<div class="row" style="margin-bottom:4px"><div class="sub" style="margin:0">${esc(nameOf(t))} ${title.toLowerCase()}</div><span class="spacer" style="flex:1"></span>`
    + `<a class="fb-link" href="${fbHref(t, 'scale', fbName)}">show on fretboard</a>${playBtn('scale', 'Play the scale')}</div>`
    + jumps
    + `<div data-group="scale"><table class="degrees">${rows}</table></div>`
    + `<div class="steps" aria-label="Whole and half steps">${steps}</div>`);
}

function renderPent() {
  const t = tonic();
  const isMaj = S.mode === 'major';
  const rel = isMaj ? minorKeyAt(S.pos) : majorKeyAt(S.pos);
  const M = isMaj ? t : rel, m = isMaj ? rel : t;       // the major and minor tonics sharing these notes
  const rows = [
    { key: 'majPent', t: M, title: nameOf(M) + ' major pentatonic', f: FORMULAS.majPent, fb: 'Maj Pent', meta: 'Major scale without the 4th and 7th.' },
    { key: 'majBlues', t: M, title: nameOf(M) + ' major blues', f: FORMULAS.majBlues, fb: 'Maj Blues', meta: 'Major pentatonic plus the ♭3 “blue note”.', blue: 'b3' },
    { key: 'minPent', t: m, title: nameOf(m) + ' minor pentatonic', f: FORMULAS.minPent, fb: 'Min Pent', meta: 'Natural minor without the 2nd and ♭6.' },
    { key: 'minBlues', t: m, title: nameOf(m) + ' minor blues', f: FORMULAS.minBlues, fb: 'Min Blues', meta: 'Minor pentatonic plus the ♭5 “blue note”.', blue: 'b5' }
  ];
  if (!isMaj) rows.push(rows.shift(), rows.shift());   // minor key: minor scales first
  VIEW.pent = rows.map(r => ({ ...r, notes: build(r.t, r.f) }));
  setCard('pent', 'Pentatonic & blues', '',
    `<p class="small muted" style="margin:-4px 0 10px">${esc(nameOf(M))} major and ${esc(nameOf(m))} minor pentatonic use the same five notes.</p>`
    + VIEW.pent.map((r, k) =>
      `<div class="scale-row" data-group="pent${k}">${playBtn('pent', 'Play ' + r.title, `data-k="${k}"`)}`
      + `<div class="row" style="gap:4px"><span class="name">${esc(r.title)}</span>${fbIcon(fbHref(r.t, 'scale', r.fb), r.title)}</div>`
      + `<div class="meta">${r.meta}</div>`
      + `<div class="chips sm" style="grid-column:2">${r.notes.map((n, i) => chip(n.name, i, (i === 0 ? 'root ' : '') + (n.deg === r.blue ? 'blue' : ''), n.deg.replace('b', '♭'))).join('')}</div></div>`
    ).join(''));
}

function renderKeySig() {
  const pos = S.pos, n = sigCount(pos);
  const M = majorKeyAt(pos), m = minorKeyAt(pos);
  const accs = n > 0 ? SHARP_ORDER.slice(0, n) : FLAT_ORDER.slice(0, -n);
  const sym = n > 0 ? '♯' : '♭';
  const { t, notes } = { t: tonic(), notes: build(tonic(), S.mode === 'major' ? FORMULAS.major : FORMULAS.minor) };
  VIEW.keysig = { t, notes };
  setCard('keysig', 'Key signature & notation', playBtn('keysig', 'Play the scale on the staff'),
    `<div class="sub" style="margin:0">${n === 0 ? 'No sharps or flats' : Math.abs(n) + ' ' + (n > 0 ? 'sharp' : 'flat') + (Math.abs(n) > 1 ? 's' : '')}</div>`
    + `<p class="small muted" style="margin:2px 0 0">${accs.length ? accs.map(a => a + sym).join(' ') + ' · ' : ''}shared by ${esc(keyName(M, 'major'))} and ${esc(keyName(m, 'minor'))}</p>`
    + `<div data-group="staff">${staffSvg(t, notes, n)}</div>`
    + `<p class="small muted" style="margin-top:6px">${n >= 0
        ? 'Order of sharps: F C G D A E B'
        : 'Order of flats: B E A D G C F'} </p>`);
}

// Accidentals drawn as vector shapes (font glyphs vary too much between devices).
const sharpSvg = (x, y) => `<g class="accg"><line x1="${x - 2}" y1="${y - 7.5}" x2="${x - 2}" y2="${y + 9}"/><line x1="${x + 2}" y1="${y - 9}" x2="${x + 2}" y2="${y + 7.5}"/>`
  + `<path class="thick" d="M${x - 5} ${y - 1.2}L${x + 5} ${y - 4.2}M${x - 5} ${y + 4.2}L${x + 5} ${y + 1.2}"/></g>`;
const flatSvg = (x, y) => `<g class="accg"><line x1="${x - 3}" y1="${y - 13}" x2="${x - 3}" y2="${y + 4.5}"/>`
  + `<path class="bowl" d="M${x - 3} ${y + 4.5}C${x + 7} ${y - 0.5} ${x + 5} ${y - 6} ${x - 3} ${y - 1}"/></g>`;

// Treble-clef staff: key signature, then the scale (one octave) as whole notes.
function staffSvg(t, notes, n) {
  const W = 420, top = 34, gap = 9;                   // top line F5
  const y = st => top + (8 - st) * gap / 2;           // step 0 = E4 (bottom line)
  const stepOf = (l, oct) => (oct - 4) * 7 + (l - 2);
  const SH = [8, 5, 9, 6, 3, 7, 4], FL = [4, 7, 3, 6, 2, 5, 1];   // staff steps of F♯ C♯ G♯ D♯ A♯ E♯ B♯ / B♭ E♭ A♭ D♭ G♭ C♭ F♭
  let s = `<svg class="staff" viewBox="0 0 ${W} 112" role="img" aria-label="${esc(keyName(t, S.mode))} scale in treble clef">`;
  for (let i = 0; i < 5; i++) s += `<line x1="4" x2="${W - 4}" y1="${top + i * gap}" y2="${top + i * gap}"/>`;
  s += `<text class="clef" x="6" y="${top + 3.3 * gap}" font-size="${gap * 6.2}">𝄞</text>`;
  let x = 46;
  const list = n > 0 ? SH.slice(0, n) : FL.slice(0, -n);
  for (const st of list) { s += n > 0 ? sharpSvg(x, y(st)) : flatSvg(x, y(st)); x += 11; }
  x += 16;
  const oct0 = 4;                                     // the scale starts on the tonic in octave 4
  const full = notes.concat([{ note: t, name: nameOf(t), top: true }]);
  const dx = Math.min(40, (W - x - 16) / full.length);
  let prevL = -1, oct = oct0;
  full.forEach((nt, i) => {
    const l = nt.note[0];
    if (i > 0 && l <= prevL) oct++;
    prevL = l;
    const st = stepOf(l, oct);
    const cx = x + i * dx + dx / 2, cy = y(st);
    let ledg = '';
    for (let k = -2; k >= st; k -= 2) ledg += `<line x1="${cx - 10}" x2="${cx + 10}" y1="${y(k)}" y2="${y(k)}"/>`;
    for (let k = 10; k <= st; k += 2) ledg += `<line x1="${cx - 10}" x2="${cx + 10}" y1="${y(k)}" y2="${y(k)}"/>`;
    s += `<g class="snote" data-note="${i}"><rect x="${cx - dx / 2}" y="2" width="${dx}" height="108" fill="transparent"/>${ledg}<ellipse cx="${cx}" cy="${cy}" rx="6.4" ry="4.4" transform="rotate(-20 ${cx} ${cy})"/>`
      + `<text class="nlbl" x="${cx}" y="104">${esc(nt.name)}</text></g>`;
  });
  return s + '</svg>';
}

function renderModes() {
  const t = tonic();
  const parent = S.mode === 'major' ? t : majorKeyAt(S.pos);       // relative modes come from the major key
  const parentScale = build(parent, FORMULAS.major);
  const current = S.mode === 'major' ? 0 : 5;
  const rows = MODES.map((md, i) => {
    const mt = S.modeView === 'relative' ? parentScale[i].note : t;
    return { ...md, t: mt, notes: build(mt, md.f), current: S.modeView === 'relative' ? i === current : (S.mode === 'major' ? i === 0 : i === 5) };
  });
  VIEW.modes = rows;
  const seg = `<div class="seg" role="radiogroup" aria-label="Which modes">${[['relative', 'Relative'], ['parallel', 'Parallel']].map(([k, l]) =>
    `<button type="button" data-modeview="${k}" class="${S.modeView === k ? 'active' : ''}" role="radio" aria-checked="${S.modeView === k}">${l}</button>`).join('')}</div>`;
  const explain = S.modeView === 'relative'
    ? `The seven modes of ${esc(keyName(parent, 'major'))}: the same notes, each starting on a different degree.`
    : `Every mode starting on ${esc(nameOf(t))}: the same tonic with a different set of notes.`;
  setCard('modes', 'Modes', seg,
    `<p class="small muted" style="margin:-4px 0 8px">${explain}</p>`
    + rows.map((r, k) =>
      `<div class="mode-row${r.current ? ' current' : ''}" data-group="mode${k}">${playBtn('mode', 'Play ' + nameOf(r.t) + ' ' + r.name, `data-k="${k}"`)}`
      + `<div class="mname">${esc(nameOf(r.t))} ${r.name} ${fbIcon(fbHref(r.t, 'scale', r.fb), nameOf(r.t) + ' ' + r.name)}</div>`
      + `<div class="chips sm">${r.notes.map((n, i) => chip(n.name, i, i === 0 ? 'root' : '', n.deg.replace('b', '♭').replace('#', '♯'))).join('')}</div></div>`
    ).join(''));
}

// Chord names the fretboard page understands.
const FB_CHORD = { '': 'Major', 'm': 'Minor', '°': 'Dim', '+': 'Aug', '7': '7', 'm7': 'm7', '5': '5', 'sus2': 'Sus2', 'sus4': 'Sus4' };
// Scales the Diatonic chords card can build from ('key' follows the wheel).
const CHORD_SCALES = [
  ['key', 'Key'], ['major', 'Major (Ionian)', FORMULAS.major], ['minor', 'Natural minor (Aeolian)', FORMULAS.minor],
  ['harmonic', 'Harmonic minor', FORMULAS.harmonic], ['melodic', 'Melodic minor', FORMULAS.melodic],
  ...MODES.filter(m => m.name !== 'Ionian' && m.name !== 'Aeolian').map(m => [m.name.toLowerCase(), m.name, m.f])
];

function renderChords() {
  const t = tonic();
  const isMaj = S.mode === 'major';
  const src = CHORD_SCALES.find(x => x[0] === S.chordScale) || CHORD_SCALES[0];
  const srcFormula = src[0] === 'key' ? (isMaj ? FORMULAS.major : FORMULAS.minor) : src[2];
  const chords = diatonic(build(t, srcFormula), S.chordView);
  // Minor keys usually borrow V (and vii°) from harmonic minor.
  const borrowed = (isMaj || src[0] !== 'key') ? []
    : diatonic(build(t, FORMULAS.harmonic), S.chordView).filter((c, i) => (i === 4 || i === 6) && c.valid);
  const all = chords.concat(borrowed);
  VIEW.chords = { all };
  const typeName = CHORD_TYPES.find(c => c[0] === S.chordView)[1].toLowerCase();
  const tile = (c, i, cls = '') => {
    if (!c.valid) {
      return `<div class="tile na" title="No ${esc(typeName.replace(/s$/, '').replace(/ \(5\)/, ''))} on this degree of the scale">`
        + `<div class="rn">${c.num}</div><div class="cn">${esc(c.root.name)} –</div><div class="tn">${c.tones.map(x => x.name).join(' ')}</div></div>`;
    }
    const q = c.sym.slice(c.root.name.length);
    const fb = FB_CHORD[q];
    return `<div class="tile ${cls}" role="button" tabindex="0" data-chord="${i}" title="Play ${esc(c.sym)}">`
      + `<div class="rn">${c.num}</div><div class="cn">${esc(c.sym)}</div><div class="tn">${c.tones.map(x => x.name).join(' ')}</div>`
      + (fb ? fbIcon(fbHref(c.root.note, 'chord', fb), c.sym) : '') + `</div>`;
  };
  const keyLabel = 'Key: ' + keyName(t, S.mode);
  const selects =
    `<select class="sel" data-chordscale aria-label="Scale the chords are built from">${CHORD_SCALES.map(([k, l]) =>
      `<option value="${k}"${S.chordScale === k ? ' selected' : ''}>${esc(k === 'key' ? keyLabel : nameOf(t) + ' ' + l)}</option>`).join('')}</select>`
    + `<select class="sel" data-chordtype aria-label="Chord type">${CHORD_TYPES.map(([k, l]) =>
      `<option value="${k}"${S.chordView === k ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
  const srcName = src[0] === 'key' ? keyName(t, S.mode) : nameOf(t) + ' ' + src[1].toLowerCase().replace(/^(\w+) \((.*)\)$/, '$1');
  const na = chords.some(c => !c.valid);
  setCard('chords', 'Diatonic chords', playBtn('allchords', 'Play all chords in order'),
    `<div class="row" style="margin-bottom:6px">${selects}</div>`
    + `<p class="small muted" style="margin:0 0 8px">The ${esc(typeName)} built from the notes of ${esc(srcName)}`
    + `${borrowed.length ? ', plus the V and vii° usually borrowed from harmonic minor (dashed)' : ''}.`
    + `${na ? ' Degrees marked – have no ' + esc(typeName.replace(/ \(5\)/, '')) + ' in this scale.' : ''} Tap a chord to hear it.</p>`
    + `<div class="tiles" data-group="chords">${chords.map((c, i) => tile(c, i)).join('')}${borrowed.map((c, i) => tile(c, chords.length + i, 'borrowed')).join('')}</div>`);
}

function renderProgs() {
  const t = tonic();
  const isMaj = S.mode === 'major';
  const scale = build(t, isMaj ? FORMULAS.major : FORMULAS.minor);
  // Common progressions, by scale degree (0-based) — 7ths used for the 12-bar blues.
  const P = isMaj
    ? [['I – IV – V – I', [0, 3, 4, 0]], ['I – V – vi – IV', [0, 4, 5, 3]], ['I – vi – IV – V', [0, 5, 3, 4]], ['ii – V – I', [1, 4, 0]], ['vi – IV – I – V', [5, 3, 0, 4]], ['12-bar blues', 'blues']]
    : [['i – iv – v – i', [0, 3, 4, 0]], ['i – VI – III – VII', [0, 5, 2, 6]], ['i – VII – VI – V (Andalusian)', [0, 6, 5, 'V']], ['ii° – V – i', [1, 'V', 0]], ['i – iv – V – i (harmonic)', [0, 3, 'V', 0]], ['12-bar minor blues', 'blues']];
  const V = diatonic(build(t, FORMULAS.harmonic), 'triads')[4];
  const tri = diatonic(scale, 'triads');
  const dom7 = (root) => ({ root, tones: build(root.note, ['1', '3', '5', 'b7']), semis: [0, 4, 7, 10], sym: root.name + '7', num: '' });
  const min7 = (root) => ({ root, tones: build(root.note, ['1', 'b3', '5', 'b7']), semis: [0, 3, 7, 10], sym: root.name + 'm7', num: '' });
  const progs = P.map(([name, seq]) => {
    let list;
    if (seq === 'blues') {
      const f = isMaj ? dom7 : min7;
      const I = f(scale[0]), IV = f(scale[3]), Vc = dom7(isMaj ? scale[4] : V.root);
      list = [I, I, I, I, IV, IV, I, I, Vc, IV, I, Vc];
    } else list = seq.map(d => d === 'V' ? V : tri[d]);
    return { name, list };
  });
  VIEW.progs = progs;
  setCard('progs', 'Common progressions', '',
    `<p class="small muted" style="margin:0 0 8px">In ${esc(keyName(t, S.mode))} — follows the key on the wheel. Tap a chord to hear it.</p>`
    + progs.map((p, k) =>
      `<div class="prog" data-group="prog${k}">${playBtn('prog', 'Play ' + p.name, `data-k="${k}"`)}<span class="pname">${esc(p.name)}</span>`
      + `<div class="chips sm pchords">${p.list.map((c, i) => `<button type="button" class="chip" data-progchord="${i}">${esc(c.sym)}</button>`).join('')}</div></div>`
    ).join(''));
}

const QUALITIES = [
  ['Major', '', ['1', '3', '5'], 'Major'], ['Minor', 'm', ['1', 'b3', '5'], 'Minor'], ['Power (5)', '5', ['1', '5'], '5'],
  ['Diminished', '°', ['1', 'b3', 'b5'], 'Dim'], ['Augmented', '+', ['1', '3', '#5'], 'Aug'],
  ['Sus2', 'sus2', ['1', '2', '5'], 'Sus2'], ['Sus4', 'sus4', ['1', '4', '5'], 'Sus4'],
  ['Dominant 7', '7', ['1', '3', '5', 'b7'], '7'], ['Major 7', 'maj7', ['1', '3', '5', '7']], ['Minor 7', 'm7', ['1', 'b3', '5', 'b7'], 'm7'],
  ['Half-diminished', 'm7♭5', ['1', 'b3', 'b5', 'b7']], ['Diminished 7', '°7', ['1', 'b3', 'b5', 'bb7']],
  ['Major 6', '6', ['1', '3', '5', '6']], ['Minor 6', 'm6', ['1', 'b3', '5', '6']],
  ['Add9', 'add9', ['1', '3', '5', '9'], 'Add9'], ['Dominant 9', '9', ['1', '3', '5', 'b7', '9']]
];
function renderQuality() {
  const t = tonic();
  VIEW.quality = QUALITIES.map(([name, suf, f, fb]) => {
    const tones = build(t, f);
    return { name, sym: nameOf(t) + suf, tones, semis: tones.map(x => x.semis), fb, root: { note: t } };
  });
  setCard('quality', 'Chords built on ' + nameOf(t), '',
    `<div class="tiles wide" data-group="quality">${VIEW.quality.map((q, i) =>
      `<div class="tile" role="button" tabindex="0" data-qual="${i}" title="Play ${esc(q.sym)}"><div class="rn">${q.name}</div><div class="cn">${esc(q.sym)}</div>`
      + `<div class="tn">${q.tones.map(x => x.name).join(' ')}</div><div class="tn">${QUALITIES[i][2].join(' ').replace(/b/g, '♭').replace(/#/g, '♯')}</div>`
      + (q.fb ? fbIcon(fbHref(t, 'chord', q.fb), q.sym) : '') + `</div>`).join('')}</div>`);
}

function render() {
  stopAll();
  VIEW.refs = [];
  drawWheel();
  renderScale(); renderPent(); renderKeySig(); renderModes(); renderChords(); renderProgs(); renderQuality();
  renderNeck(); renderCapo(); renderIntervals(); renderFunctions();
  updateKeyboard(); updateKeySelect();
  try { history.replaceState(null, '', '#key=' + encodeURIComponent(nameOf(tonic()) + (S.mode === 'minor' ? 'm' : ''))); } catch (e) {}
}

// ════════════════════════════════════════════════════════════════
// INTERACTION
// ════════════════════════════════════════════════════════════════
const chipsIn = g => g ? [...g.querySelectorAll('[data-note]')] : [];
function strumStep(midis, at, el, hold) { return { at, midis, strum: 32, el, hold: hold || 700, vel: 0.9 }; }

document.addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const b = e.target.closest('button, .tile');
  if (!b) return;
  const group = b.closest('[data-group]') || b.closest('.card');
  const card = b.closest('.card');

  if (b.dataset.minor) { S.minorType = b.dataset.minor; renderScale(); renderNeck(); updateKeyboard(); return; }
  if (b.dataset.necklabel) { S.neckLabel = b.dataset.necklabel; renderNeck(); return; }
  if (b.dataset.ref != null) {
    const list = VIEW.refs[+b.dataset.ref] || [];
    perform(list.map((c, i) => strumStep(chordMidis(c), i * 900, b, list.length > 1 ? 1700 : 700)), list.length > 1 ? b : null);
    return;
  }
  if (b.dataset.modeview) { S.modeView = b.dataset.modeview; renderModes(); return; }

  if (b.dataset.go) {
    if (b.dataset.go === 'rel') setMode(S.mode === 'major' ? 'minor' : 'major');
    else selectKey(VIEW.jump.parPos, S.mode === 'major' ? 'minor' : 'major');
    return;
  }

  // Play buttons
  const act = b.dataset.act;
  if (act) {
    let steps = [];
    const k = +b.dataset.k;
    if (act === 'scale') steps = scaleSteps(VIEW.scale.notes, VIEW.scale.t, chipsIn(card.querySelector('[data-group="scale"]')));
    else if (act === 'pent') steps = scaleSteps(VIEW.pent[k].notes, VIEW.pent[k].t, chipsIn(group));
    else if (act === 'mode') steps = scaleSteps(VIEW.modes[k].notes, VIEW.modes[k].t, chipsIn(group));
    else if (act === 'keysig') steps = scaleSteps(VIEW.keysig.notes, VIEW.keysig.t, [...card.querySelectorAll('g.snote')], { upOnly: false })
        .map((s, i, arr) => ({ ...s, el: card.querySelectorAll('g.snote')[i < 8 ? i : 14 - i] }));
    else if (act === 'neck') {
      const seen = new Set();
      const dots = VIEW.neck.dots.filter(d => d.inWin).sort((a, b) => a.midi - b.midi).filter(d => !seen.has(d.midi) && seen.add(d.midi));
      const els = dots.map(d => card.querySelector(`g.ndot[data-midi="${d.midi}"]:not(.dim)`));
      const seq = dots.map((d, i) => ({ m: d.midi, el: els[i] }));
      const run = seq.concat(seq.slice(0, -1).reverse());
      const gap = run.length > 40 ? 150 : 200;
      steps = run.map((x, i) => ({ at: i * gap, midis: [x.m], el: x.el, hold: gap }));
    } else if (act === 'ivl') {
      const r = VIEW.intervals[k], base = scaleBase(tonic()), row = b.closest('tr');
      steps = [{ at: 0, midis: [base], el: row, hold: 450 }, { at: 450, midis: [base + r.note.semis], el: row, hold: 500 },
               { at: 1050, midis: [base, base + r.note.semis], el: row, hold: 900 }];
    } else if (act === 'allchords') {
      const tiles = [...card.querySelectorAll('.tile')];
      steps = VIEW.chords.all.slice(0, 7).map((c, i) => c.valid ? strumStep(chordMidis(c), i * 850, tiles[i], 800) : null).filter(Boolean)
        .map((st, k) => ({ ...st, at: k * 850 }));
    } else if (act === 'prog') {
      const p = VIEW.progs[k];
      const chips = [...group.querySelectorAll('[data-progchord]')];
      const gap = p.list.length > 8 ? 700 : 950;
      steps = p.list.map((c, i) => strumStep(chordMidis(c), i * gap, chips[i], gap));
    }
    perform(steps, b);
    return;
  }

  // Single notes and chords
  if (b.dataset.progchord != null) {
    const k = +group.querySelector('[data-act]').dataset.k;
    const c = VIEW.progs[k].list[+b.dataset.progchord];
    perform([strumStep(chordMidis(c), 0, b)]);
    return;
  }
  if (b.dataset.chord != null) { const c = VIEW.chords.all[+b.dataset.chord]; perform([strumStep(chordMidis(c), 0, b)]); return; }
  if (b.dataset.qual != null) { const q = VIEW.quality[+b.dataset.qual]; perform([strumStep(q.semis.map(s => chordBase(q.root.note) + s), 0, b)]); return; }
  if (b.dataset.note != null) {
    const i = +b.dataset.note;
    let notes, t;
    const gname = group && group.dataset.group || '';
    if (gname === 'scale') ({ notes, t } = VIEW.scale);
    else if (gname.startsWith('pent')) { const r = VIEW.pent[+gname.slice(4)]; notes = r.notes; t = r.t; }
    else if (gname.startsWith('mode')) { const r = VIEW.modes[+gname.slice(4)]; notes = r.notes; t = r.t; }
    if (notes) perform([{ at: 0, midis: [scaleBase(t) + notes[i].semis], el: b, hold: 500 }]);
  }
});
// neck dots are SVG too
document.addEventListener('click', e => {
  const g = e.target.closest('g.ndot');
  if (g) perform([{ at: 0, midis: [+g.dataset.midi], el: g, hold: 500 }]);
});
// staff notes are SVG, so handle them separately
document.addEventListener('click', e => {
  const g = e.target.closest('g.snote');
  if (!g) return;
  const i = +g.dataset.note, { notes, t } = VIEW.keysig;
  const semis = i < notes.length ? notes[i].semis : 12;
  perform([{ at: 0, midis: [scaleBase(t) + semis], el: g, hold: 500 }]);
});
// dropdowns
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-chordscale]')) { S.chordScale = el.value; renderChords(); }
  else if (el.matches('[data-chordtype]')) { S.chordView = el.value; renderChords(); }
  else if (el.matches('[data-neckscale]')) { S.neckScale = el.value; S.neckPos = 'all'; renderNeck(); }
  else if (el.matches('[data-neckpos]')) { S.neckPos = el.value; renderNeck(); }
  else if (el.matches('[data-transpose]')) { S.transTo = +el.value; renderCapo(); }
  else if (el.id === 'key-select') { const [pos, mode] = el.value.split(':'); selectKey(+pos, mode); }
});
// keyboard for tiles
document.addEventListener('keydown', e => {
  const tl = e.target.closest && e.target.closest('.tile');
  if (tl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tl.click(); }
});

// ── Theme (shared with the fretboard page) ──
function setTheme(dark) {
  document.body.classList.toggle('light', !dark);
  document.getElementById('theme-dark').classList.toggle('active', dark);
  document.getElementById('theme-light').classList.toggle('active', !dark);
  document.getElementById('theme-dark').setAttribute('aria-checked', String(dark));
  document.getElementById('theme-light').setAttribute('aria-checked', String(!dark));
  try { localStorage.setItem('fbTheme', dark ? 'dark' : 'light'); } catch (e) {}
}

// ════════════════════════════════════════════════════════════════
// CARD LAYOUT — columns of cards you can reorder, hide and add back
// ════════════════════════════════════════════════════════════════
const CARD_NAMES = {
  wheel: 'Circle of fifths', scale: 'Scale', keysig: 'Key signature & notation', pent: 'Pentatonic & blues',
  chords: 'Diatonic chords', progs: 'Common progressions', modes: 'Modes', quality: 'Chords on the tonic',
  neck: 'Scale on the neck', capo: 'Capo & transpose', intervals: 'Intervals', functions: 'Chord functions'
};
const DEFAULT_LAYOUT = {
  left: ['keysig', 'quality'], center: ['wheel', 'chords', 'progs'], right: ['scale', 'modes', 'pent'],
  hidden: ['neck', 'capo', 'intervals', 'functions']
};
const LAYOUT_VERSION = 2;          // bump to give everyone the new default layout once
const LOGICAL = ['left', 'center', 'right'];
let LAYOUT = null;
const cardEl = {};

function cloneLayout(L) { return { left: L.left.slice(), center: L.center.slice(), right: L.right.slice(), hidden: L.hidden.slice() }; }
// A saved layout keeps working when cards are added or removed in an update:
// unknown cards are dropped and new ones wait in "Add card".
function loadLayout() {
  try {
    const L = JSON.parse(localStorage.getItem('theoryLayout') || 'null');
    if (L && L.v === LAYOUT_VERSION && ['left', 'center', 'right', 'hidden'].every(k => Array.isArray(L[k]))) {
      const ids = Object.keys(CARD_NAMES), seen = new Set();
      const keep = list => list.filter(id => ids.includes(id) && !seen.has(id) && seen.add(id));
      const out = { left: keep(L.left), center: keep(L.center), right: keep(L.right), hidden: keep(L.hidden) };
      // Progressions used to live inside the Diatonic chords card: keep them right below it.
      if (!seen.has('progs')) {
        const col = ['left', 'center', 'right', 'hidden'].find(c => out[c].includes('chords')) || 'center';
        const at = out[col].indexOf('chords');
        out[col].splice(at < 0 ? out[col].length : at + 1, 0, 'progs'); seen.add('progs');
      }
      ids.forEach(id => { if (!seen.has(id)) (id === 'wheel' ? out.center.unshift(id) : out.hidden.push(id)); });
      return out;
    }
  } catch (e) {}
  return cloneLayout(DEFAULT_LAYOUT);
}
function saveLayout() {
  try { localStorage.setItem('theoryLayout', JSON.stringify({ ...LAYOUT, v: LAYOUT_VERSION })); } catch (e) {}
  const same = JSON.stringify(LAYOUT) === JSON.stringify(DEFAULT_LAYOUT);
  document.getElementById('reset-layout').hidden = same;
}
function resetLayout() { LAYOUT = cloneLayout(DEFAULT_LAYOUT); COLLAPSED.clear(); saveLayout(); placeCards(); applyCollapsed(); }

// Collapsed cards keep their place but show only their title bar.
const COLLAPSED = new Set();
try { JSON.parse(localStorage.getItem('theoryCollapsed') || '[]').forEach(id => COLLAPSED.add(id)); } catch (e) {}
function applyCollapsed() {
  for (const id of Object.keys(cardEl)) {
    const on = COLLAPSED.has(id), el = cardEl[id], f = el.querySelector('.fold');
    el.classList.toggle('collapsed', on);
    f.setAttribute('aria-expanded', String(!on));
    f.setAttribute('aria-label', (on ? 'Expand' : 'Collapse') + ' the ' + CARD_NAMES[id] + ' card');
  }
  const shown = LOGICAL.flatMap(sg => LAYOUT[sg]);
  const allFolded = shown.length > 0 && shown.every(id => COLLAPSED.has(id));
  const btn = document.getElementById('fold-all');
  btn.textContent = allFolded ? 'Expand all' : 'Collapse all';
  try { localStorage.setItem('theoryCollapsed', JSON.stringify([...COLLAPSED])); } catch (e) {}
}
function setCollapsed(id, on) {
  if (on) {
    COLLAPSED.add(id);
    if (A.btn && cardEl[id].contains(A.btn)) stopAll();
  } else COLLAPSED.delete(id);
  applyCollapsed();
  if (!on && id === 'wheel') drawWheel();
}
function foldAll() {
  const shown = LOGICAL.flatMap(sg => LAYOUT[sg]);
  const fold = !shown.every(id => COLLAPSED.has(id));
  shown.forEach(id => fold ? COLLAPSED.add(id) : COLLAPSED.delete(id));
  if (fold) stopAll();
  applyCollapsed();
}

// Card frames: a bar with a drag handle, the title, the card's own controls
// and a close button; render functions fill the body.
function buildCards() {
  cardEl.wheel = document.getElementById('wheel-card');
  for (const id of Object.keys(CARD_NAMES)) {
    if (id === 'wheel') continue;
    const el = document.createElement('section');
    el.className = 'card';
    el.dataset.card = id;
    el.innerHTML =
      `<div class="card-bar"><button type="button" class="grip" aria-label="Move the ${CARD_NAMES[id]} card (drag, or use the arrow keys)" title="Drag to move">&#8942;&#8942;</button>`
      + `<button type="button" class="fold" aria-expanded="true" aria-label="Collapse the ${CARD_NAMES[id]} card" title="Collapse / expand"></button>`
      + `<h2 id="title-${id}"></h2><span class="tools" id="tools-${id}"></span>`
      + `<button type="button" class="close" aria-label="Hide the ${CARD_NAMES[id]} card" title="Hide card">&times;</button></div>`
      + `<div class="card-body" id="card-${id}"></div>`;
    cardEl[id] = el;
  }
}
function setCard(id, title, tools, body) {        // works for hidden (detached) cards too
  const el = cardEl[id];
  el.querySelector('h2').textContent = title;
  el.querySelector('.tools').innerHTML = tools;
  el.querySelector('.card-body').innerHTML = body;
}

// How the three logical columns are shown for the screen width.
function visualColumns() {
  const w = window.innerWidth;
  if (w >= 1180) return [['left'], ['center'], ['right']];
  if (w >= 760) return [['center'], ['left', 'right']];
  return [['center', 'left', 'right']];
}
let visKey = '';
function placeCards() {
  const main = document.getElementById('layout');
  const vis = visualColumns();
  visKey = JSON.stringify(vis);
  main.style.gridTemplateColumns = vis.length === 3
    ? 'minmax(0, 1fr) minmax(0, 1.22fr) minmax(0, 1fr)' : `repeat(${vis.length}, minmax(0, 1fr))`;
  const cols = vis.map(segs => {
    const col = document.createElement('div');
    col.className = 'col';
    col.dataset.segs = segs.join(',');
    for (const sg of segs) for (const id of LAYOUT[sg]) { cardEl[id].dataset.col = sg; col.appendChild(cardEl[id]); }
    if (LAYOUT.hidden.length) col.appendChild(addBox(segs[segs.length - 1]));
    return col;
  });
  main.replaceChildren(...cols);
  saveLayout();
}
function addBox(seg) {
  const box = document.createElement('div');
  box.className = 'add-box';
  box.innerHTML = '<span>+ Add card:</span>' + LAYOUT.hidden.map(id =>
    `<button type="button" data-add="${id}" data-seg="${seg}">${CARD_NAMES[id]}</button>`).join('');
  return box;
}
function hideCard(id) {
  for (const sg of LOGICAL) LAYOUT[sg] = LAYOUT[sg].filter(x => x !== id);
  if (!LAYOUT.hidden.includes(id)) LAYOUT.hidden.push(id);
  if (A.btn && cardEl[id].contains(A.btn)) stopAll();
  placeCards();
  applyCollapsed();
}
function showCard(id, seg) {
  LAYOUT.hidden = LAYOUT.hidden.filter(x => x !== id);
  LAYOUT[seg].push(id);
  COLLAPSED.delete(id);
  placeCards();
  applyCollapsed();
  if (id === 'wheel') drawWheel();
  cardEl[id].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  cardEl[id].querySelector('.grip').focus({ preventScroll: true });
}
document.addEventListener('click', e => {
  const add = e.target.closest('[data-add]');
  if (add) { showCard(add.dataset.add, add.dataset.seg); return; }
  const close = e.target.closest('.card .close');
  if (close) { hideCard(close.closest('.card').dataset.card); return; }
  const fold = e.target.closest('.card .fold, .card-bar h2');
  if (fold) { const id = fold.closest('.card').dataset.card; setCollapsed(id, !COLLAPSED.has(id)); }
});

// Keyboard: arrow keys on a card's handle move it up/down or to the next column.
document.addEventListener('keydown', e => {
  const grip = e.target.closest && e.target.closest('.grip');
  if (!grip || !['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  e.preventDefault();
  const id = grip.closest('.card').dataset.card;
  const sg = LOGICAL.find(k => LAYOUT[k].includes(id));
  const list = LAYOUT[sg], i = list.indexOf(id);
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    const j = i + (e.key === 'ArrowUp' ? -1 : 1);
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
  } else {
    const k = LOGICAL.indexOf(sg) + (e.key === 'ArrowLeft' ? -1 : 1);
    if (k < 0 || k > 2) return;
    list.splice(i, 1);
    const dest = LAYOUT[LOGICAL[k]];
    dest.splice(Math.min(i, dest.length), 0, id);
  }
  placeCards();
  grip.focus();
});

// Drag with the handle (mouse, pen or touch).
const drag = { el: null, ph: null, dx: 0, dy: 0, y: 0, timer: null };
document.addEventListener('pointerdown', e => {
  const grip = e.target.closest('.grip');
  if (!grip || e.button > 0) return;
  e.preventDefault();
  const el = grip.closest('.card');
  const r = el.getBoundingClientRect();
  const ph = document.createElement('div');
  ph.className = 'card-ph';
  ph.style.height = Math.min(r.height, 240) + 'px';
  el.parentNode.insertBefore(ph, el);
  Object.assign(drag, { el, ph, dx: e.clientX - r.left, dy: e.clientY - r.top, y: e.clientY });
  el.classList.add('dragging');
  el.style.width = r.width + 'px';
  el.style.left = r.left + 'px';
  el.style.top = r.top + 'px';
  drag.timer = setInterval(() => {                     // scroll while holding near the edges
    if (drag.y < 70) window.scrollBy(0, -14);
    else if (drag.y > window.innerHeight - 70) window.scrollBy(0, 14);
  }, 16);
});
document.addEventListener('pointermove', e => {
  if (!drag.el) return;
  drag.y = e.clientY;
  drag.el.style.left = (e.clientX - drag.dx) + 'px';
  drag.el.style.top = (e.clientY - drag.dy) + 'px';
  const cols = [...document.querySelectorAll('#layout .col')];
  let col = cols.find(c => { const r = c.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right; });
  if (!col) col = cols.reduce((best, c) => {
    const r = c.getBoundingClientRect(), d = Math.min(Math.abs(e.clientX - r.left), Math.abs(e.clientX - r.right));
    return !best || d < best.d ? { c, d } : best;
  }, null).c;
  const cards = [...col.querySelectorAll(':scope > .card[data-card]')].filter(c => c !== drag.el);
  const before = cards.find(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
  if (before) { if (drag.ph.nextSibling !== before) col.insertBefore(drag.ph, before); }
  else {
    const box = col.querySelector(':scope > .add-box');
    if (box) { if (drag.ph.nextSibling !== box) col.insertBefore(drag.ph, box); }
    else if (col.lastElementChild !== drag.ph) col.appendChild(drag.ph);
  }
});
function endDrag(cancel) {
  if (!drag.el) return;
  clearInterval(drag.timer);
  const { el, ph } = drag;
  el.classList.remove('dragging');
  el.style.width = el.style.left = el.style.top = '';
  if (!cancel) {
    const col = ph.parentNode;
    col.insertBefore(el, ph);
    // Which logical column the card joins: its neighbour's, or the column's first.
    const sib = (n, dir) => { while (n && !(n.dataset && n.dataset.card)) n = n[dir]; return n; };
    const prev = sib(el.previousElementSibling, 'previousElementSibling');
    const next = sib(el.nextElementSibling, 'nextElementSibling');
    el.dataset.col = prev ? prev.dataset.col : next ? next.dataset.col : col.dataset.segs.split(',')[0];
    const L = { left: [], center: [], right: [], hidden: LAYOUT.hidden.slice() };
    document.querySelectorAll('#layout .col').forEach(c =>
      c.querySelectorAll(':scope > .card[data-card]').forEach(x => L[x.dataset.col].push(x.dataset.card)));
    LAYOUT = L;
  }
  ph.remove();
  drag.el = drag.ph = null;
  placeCards();
}
document.addEventListener('pointerup', () => endDrag(false));
document.addEventListener('pointercancel', () => endDrag(true));
document.addEventListener('keydown', e => { if (e.key === 'Escape') endDrag(true); });
window.addEventListener('resize', () => { if (JSON.stringify(visualColumns()) !== visKey && !drag.el) placeCards(); });

// ════════════════════════════════════════════════════════════════
// MORE CARDS: scale on the neck, capo & transpose, intervals, functions
// ════════════════════════════════════════════════════════════════
// A chord from a spelled root and a formula, in the shape chordMidis() plays.
function mkChord(rootNote, formula, sym) {
  const tones = build(rootNote, formula);
  return { root: { note: rootNote, name: nameOf(rootNote) }, tones, semis: tones.map(x => x.semis), sym: sym || nameOf(rootNote) };
}
// Tappable chip that plays one or more chords in a row.
function refChip(label, sub, chords, cls = '') {
  VIEW.refs.push(chords);
  return `<button type="button" class="chip ${cls}" data-ref="${VIEW.refs.length - 1}" title="Play ${esc(chords.map(c => c.sym).join(' → '))}">${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ''}</button>`;
}

// ── Scale on the neck ──
const OPEN_MIDI = [64, 59, 55, 50, 45, 40];            // high e … low E (standard tuning)
const STRING_NAMES = ['e', 'B', 'G', 'D', 'A', 'E'];
const NECK_FRETS = 15;
const NECK_SCALES = [
  ['key', 'Key scale'], ['majPent', 'Major pentatonic', FORMULAS.majPent, 'Maj Pent'], ['minPent', 'Minor pentatonic', FORMULAS.minPent, 'Min Pent'],
  ['majBlues', 'Major blues', FORMULAS.majBlues, 'Maj Blues'], ['minBlues', 'Minor blues', FORMULAS.minBlues, 'Min Blues'],
  ['major', 'Major (Ionian)', FORMULAS.major, 'Ionian'], ['minor', 'Natural minor (Aeolian)', FORMULAS.minor, 'Aeolian'],
  ['harmonic', 'Harmonic minor', FORMULAS.harmonic, 'Harm Minor'], ['melodic', 'Melodic minor', FORMULAS.melodic, 'Mel Minor'],
  ...MODES.filter(m => m.name !== 'Ionian' && m.name !== 'Aeolian').map(m => [m.name.toLowerCase(), m.name, m.f, m.fb])
];
function neckScale() {
  const opt = NECK_SCALES.find(x => x[0] === S.neckScale) || NECK_SCALES[0];
  if (opt[0] === 'key') {
    const { t, notes } = currentScale();
    const fb = S.mode === 'major' ? 'Ionian' : { natural: 'Aeolian', harmonic: 'Harm Minor', melodic: 'Mel Minor' }[S.minorType];
    const label = S.mode === 'major' ? 'major' : S.minorType + ' minor';
    return { t, notes, fb, label, blue: null };
  }
  const t = tonic();
  return { t, notes: build(t, opt[2]), fb: opt[3], label: opt[1].toLowerCase(), blue: opt[0] === 'majBlues' ? 'b3' : opt[0] === 'minBlues' ? 'b5' : null };
}
function renderNeck() {
  const { t, notes, fb, label, blue } = neckScale();
  const byPc = {};
  notes.forEach(n => { byPc[pcOf(n.note)] = n; });
  // Positions: a five-fret window starting on each scale note of the low E string.
  const starts = [];
  for (let f = 0; f <= 12; f++) if (byPc[(40 + f) % 12]) starts.push(f);
  if (S.neckPos !== 'all' && !starts.includes(+S.neckPos)) S.neckPos = 'all';
  const lo = S.neckPos === 'all' ? 0 : +S.neckPos, hi = S.neckPos === 'all' ? NECK_FRETS : Math.min(NECK_FRETS, lo + 4);
  const W = 620, H = 150, x0 = 28, y0 = 16, fw = (W - x0 - 10) / NECK_FRETS, sh = (H - y0 - 22) / 5;
  const fx = f => f === 0 ? x0 - 12 : x0 + (f - 0.5) * fw;
  let g = '';
  for (let f = 0; f <= NECK_FRETS; f++) {
    const x = x0 + f * fw;
    g += `<line x1="${x}" x2="${x}" y1="${y0}" y2="${y0 + 5 * sh}" class="${f === 0 ? 'nut' : 'fret'}"/>`;
  }
  for (const m of [3, 5, 7, 9, 15]) g += `<circle class="mark" cx="${x0 + (m - 0.5) * fw}" cy="${y0 + 2.5 * sh}" r="3.5"/>`;
  g += `<circle class="mark" cx="${x0 + 11.5 * fw}" cy="${y0 + 1.5 * sh}" r="3.5"/><circle class="mark" cx="${x0 + 11.5 * fw}" cy="${y0 + 3.5 * sh}" r="3.5"/>`;
  for (let f = 1; f <= NECK_FRETS; f++) if ([3, 5, 7, 9, 12, 15].includes(f)) g += `<text class="fnum" x="${x0 + (f - 0.5) * fw}" y="${H - 4}">${f}</text>`;
  if (S.neckPos !== 'all') g += `<rect class="win" x="${lo === 0 ? x0 - 24 : x0 + (lo - 1) * fw}" y="${y0 - 10}" width="${(hi - (lo === 0 ? 0 : lo - 1)) * fw + (lo === 0 ? 24 : 0)}" height="${5 * sh + 20}" rx="6"/>`;
  const dots = [];
  STRING_NAMES.forEach((nm, si) => {
    const y = y0 + si * sh;
    g += `<line x1="${x0 - 22}" x2="${x0 + NECK_FRETS * fw}" y1="${y}" y2="${y}" class="str" style="stroke-width:${0.8 + si * 0.35}"/>`;
    g += `<text class="sname" x="6" y="${y}">${nm}</text>`;
    for (let f = 0; f <= NECK_FRETS; f++) {
      const midi = OPEN_MIDI[si] + f, n = byPc[midi % 12];
      if (!n) continue;
      const inWin = f >= lo && f <= hi;
      const txt = S.neckLabel === 'deg' ? n.deg.replace('b', '♭').replace('#', '♯') : n.name;
      const cls = (n.deg === '1' ? 'root' : n.deg === blue ? 'blue' : '') + (inWin ? '' : ' dim');
      dots.push({ midi, inWin, x: fx(f), y });
      g += `<g class="ndot ${cls}" data-midi="${midi}"><circle cx="${fx(f)}" cy="${y}" r="8.5"/><text x="${fx(f)}" y="${y}">${esc(txt)}</text></g>`;
    }
  });
  VIEW.neck = { dots, notes, t };
  const posOpts = `<option value="all"${S.neckPos === 'all' ? ' selected' : ''}>Whole neck</option>` + starts.map(f =>
    `<option value="${f}"${String(S.neckPos) === String(f) ? ' selected' : ''}>${f === 0 ? 'Open position (0–4)' : 'Frets ' + f + '–' + Math.min(NECK_FRETS, f + 4)}</option>`).join('');
  const tools = `<div class="seg" role="radiogroup" aria-label="Dot labels">${[['name', 'Notes'], ['deg', 'Degrees']].map(([k, l]) =>
    `<button type="button" data-necklabel="${k}" class="${S.neckLabel === k ? 'active' : ''}" role="radio" aria-checked="${S.neckLabel === k}">${l}</button>`).join('')}</div>`
    + playBtn('neck', 'Play the notes shown');
  setCard('neck', 'Scale on the neck', tools,
    `<div class="row" style="margin-bottom:6px">`
    + `<select class="sel" data-neckscale aria-label="Scale">${NECK_SCALES.map(([k, l]) =>
      `<option value="${k}"${S.neckScale === k ? ' selected' : ''}>${esc(k === 'key' ? 'Key: ' + keyName(tonic(), S.mode) + (S.mode === 'minor' && S.minorType !== 'natural' ? ' (' + S.minorType + ')' : '') : nameOf(tonic()) + ' ' + l)}</option>`).join('')}</select>`
    + `<select class="sel" data-neckpos aria-label="Position">${posOpts}</select>`
    + `<span class="spacer" style="flex:1"></span>${fbIcon(fbHref(t, 'scale', fb), nameOf(t) + ' ' + label)}</div>`
    + `<svg class="neck" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(nameOf(t) + ' ' + label)} on the guitar neck">${g}</svg>`
    + `<p class="small muted" style="margin-top:4px">Tap a dot to hear it. Green = root${blue ? ', purple = blue note' : ''}.</p>`);
}

// ── Capo & transpose ──
function renderCapo() {
  const t = tonic(), isMaj = S.mode === 'major', kpc = pcOf(t);
  // Open-position chord families and the chords used in each (I IV V / i iv V).
  const OPEN = isMaj ? [[0, 0], [4, 0], [1, 0], [5, 0], [2, 0]] : [[5, 0], [2, 0], [1, 0]];
  const familyOf = k => isMaj
    ? [mkChord(k, ['1', '3', '5']), mkChord(spell(k[0] + 3, pcOf(k) + 5), ['1', '3', '5']), mkChord(spell(k[0] + 4, pcOf(k) + 7), ['1', '3', '5'])]
    : [mkChord(k, ['1', 'b3', '5']), mkChord(spell(k[0] + 3, pcOf(k) + 5), ['1', 'b3', '5']), mkChord(spell(k[0] + 4, pcOf(k) + 7), ['1', '3', '5'])];
  const sfx = c => c.semis[1] === 3 ? 'm' : '';
  const nameC = c => nameOf(c.root.note) + sfx(c);
  let rows = '';
  for (let capo = 0; capo <= 9; capo++) {
    const shape = OPEN.find(o => pcOf(o) === ((kpc - capo) % 12 + 12) % 12);
    if (!shape) continue;
    const fam = familyOf(shape);
    const real = familyOf(t);
    const chips = fam.map((c, i) => { real[i].sym = nameC(real[i]); return refChip(nameC(c), capo ? 'sounds ' + nameC(real[i]) : '', [real[i]]); }).join('');
    rows += `<div class="capo-row"><span class="capo-n">${capo === 0 ? 'No capo' : 'Capo ' + capo}</span>`
      + `<span class="small muted">${esc(nameOf(shape))}${isMaj ? '' : 'm'} shapes</span><div class="chips sm">${chips}</div></div>`;
  }
  // Transpose the key's chords to another key.
  const keys = [];
  for (let p = 0; p < 12; p++) keys.push(isMaj ? majorKeyAt(p) : minorKeyAt(p));
  if (S.transTo == null || S.transTo === S.pos) S.transTo = (S.pos + 2) % 12;
  const to = keys[S.transTo];
  const from = build(t, isMaj ? FORMULAS.major : FORMULAS.minor);
  const into = build(to, isMaj ? FORMULAS.major : FORMULAS.minor);
  const a = diatonic(from, 'triads'), b = diatonic(into, 'triads');
  const up = ((pcOf(to) - kpc) % 12 + 12) % 12;
  const IV_NAMES = ['unison', 'minor 2nd', 'major 2nd', 'minor 3rd', 'major 3rd', 'perfect 4th', 'tritone', 'perfect 5th', 'minor 6th', 'major 6th', 'minor 7th', 'major 7th'];
  const shift = up === 0 ? 'same pitch' : up <= 6
    ? `up ${up} semitone${up > 1 ? 's' : ''} (${IV_NAMES[up]})` : `down ${12 - up} semitone${12 - up > 1 ? 's' : ''} (${IV_NAMES[12 - up]})`;
  const sel = `<select class="sel" data-transpose aria-label="Transpose to">${keys.map((k, p) => p === S.pos ? '' :
    `<option value="${p}"${p === S.transTo ? ' selected' : ''}>${esc(keyName(k, S.mode))}</option>`).join('')}</select>`;
  const line = list => list.map(c => refChip(c.sym, c.num, [c])).join('');
  setCard('capo', 'Capo & transpose', '',
    `<div class="sub" style="font-size:13px;margin-bottom:4px">Play ${esc(keyName(t, S.mode))} with open chord shapes</div>`
    + (rows || `<p class="small muted">No common open-shape family fits this key within 9 frets.</p>`)
    + `<div class="block" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">`
    + `<div class="row" style="margin-bottom:6px"><span class="sub" style="font-size:13px;margin:0">Transpose to</span>${sel}<span class="small muted">${esc(shift)}</span></div>`
    + `<div class="trans"><span class="small muted">${esc(nameOf(t))}</span><div class="chips sm">${line(a)}</div>`
    + `<span class="small muted">${esc(nameOf(to))}</span><div class="chips sm">${line(b)}</div></div></div>`);
}

// ── Intervals ──
const INTERVALS = [
  ['m2', 'Minor 2nd', 'b2'], ['M2', 'Major 2nd', '2'], ['m3', 'Minor 3rd', 'b3'],
  ['M3', 'Major 3rd', '3'], ['P4', 'Perfect 4th', '4'], ['TT', 'Tritone', 'b5'],
  ['P5', 'Perfect 5th', '5'], ['m6', 'Minor 6th', 'b6'], ['M6', 'Major 6th', '6'],
  ['m7', 'Minor 7th', 'b7'], ['M7', 'Major 7th', '7'], ['P8', 'Octave', '8']
];
function renderIntervals() {
  const t = tonic();
  VIEW.intervals = INTERVALS.map(([ab, name, deg]) => ({ ab, name, note: build(t, [deg])[0] }));
  setCard('intervals', 'Intervals from ' + nameOf(t), '',
    `<p class="small muted" style="margin:0 0 6px">Play the two notes one after the other, then together.</p>`
    + `<table class="ivl">` + VIEW.intervals.map((r, k) =>
      `<tr data-group="ivl${k}"><td>${playBtn('ivl', 'Play ' + r.name, `data-k="${k}"`)}</td>`
      + `<td class="muted">${r.note.semis} fret${r.note.semis > 1 ? 's' : ''}</td><td>${r.name}</td><td class="ab">${r.ab}</td>`
      + `<td><span class="chip static root">${esc(nameOf(t))}</span> → <span class="chip static">${esc(r.note.name)}</span></td></tr>`).join('')
    + `</table>`);
}

// ── Chord functions, secondary dominants, borrowed chords ──
function renderFunctions() {
  const t = tonic(), isMaj = S.mode === 'major';
  const sc = build(t, isMaj ? FORMULAS.major : FORMULAS.minor);
  const tri = diatonic(sc, 'triads'), sev = diatonic(sc, 'sevenths');
  const harm = diatonic(build(t, FORMULAS.harmonic), 'sevenths');
  const groups = isMaj
    ? [['Tonic', 'home, stable', [tri[0], tri[2], tri[5]]], ['Pre-dominant', 'moves away', [tri[1], tri[3]]], ['Dominant', 'wants to resolve', [sev[4], tri[6]]]]
    : [['Tonic', 'home, stable', [tri[0], tri[2], tri[5]]], ['Pre-dominant', 'moves away', [tri[1], tri[3]]], ['Dominant', 'wants to resolve', [harm[4], harm[6], tri[6]]]];
  const home = tri[0];
  const grp = groups.map(([name, what, list]) =>
    `<div class="fn-row"><span class="fn-name">${name}<small>${what}</small></span><div class="chips sm">${list.map(c => refChip(c.sym, c.num, [c, home])).join('')}</div></div>`).join('');
  // Secondary dominants: the V7 of each major/minor diatonic chord, resolving to it.
  const targets = tri.filter((c, i) => i > 0 && c.kind !== 'dim');
  const sec = targets.map(tc => {
    const d = mkChord(spell(tc.root.note[0] + 4, pcOf(tc.root.note) + 7), ['1', '3', '5', 'b7']);
    d.sym = d.root.name + '7';
    return refChip(d.sym + ' → ' + tc.sym, 'V7/' + tc.num, [d, tc]);
  }).join('');
  // Borrowed from the parallel key.
  const par = diatonic(build(t, isMaj ? FORMULAS.minor : FORMULAS.major), 'triads');
  const flat = (c, i) => (isMaj && [2, 5, 6].includes(i) ? '♭' : '') + c.num;
  const borrowIdx = isMaj ? [3, 2, 5, 6, 1, 4] : [0, 3, 4];
  const borrowed = borrowIdx.map(i => refChip(par[i].sym, flat(par[i], i), [par[i]])).join('');
  setCard('functions', 'Chord functions', '',
    `<p class="small muted" style="margin:0 0 6px">Tap a chord to hear it resolve to ${esc(home.sym)}.</p>` + grp
    + `<div class="block" style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border)"><div class="sub" style="font-size:13px;margin-bottom:4px">Secondary dominants</div>`
    + `<p class="small muted" style="margin:0 0 6px">The V7 of another chord in the key, used to lead into it.</p><div class="chips sm">${sec}</div></div>`
    + `<div class="block" style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border)"><div class="sub" style="font-size:13px;margin-bottom:4px">Borrowed from ${esc(keyName(t, isMaj ? 'minor' : 'major'))}</div>`
    + `<p class="small muted" style="margin:0 0 6px">${isMaj ? 'Common “modal mixture” chords from the parallel minor.' : 'The major I (Picardy third), major IV (Dorian) and V from the parallel major.'}</p>`
    + `<div class="chips sm">${borrowed}</div></div>`);
}

// ════════════════════════════════════════════════════════════════
// KEYBOARD — sticky, collapsible; lights up whatever is playing
// ════════════════════════════════════════════════════════════════
const BLACK = new Set([1, 3, 6, 8, 10]);
let kbKeys = {}, kbRange = '';
// C2–C6 on wide screens, C3–C6 on narrow ones so the keys stay tappable.
function kbBounds() { return window.innerWidth < 700 ? [48, 84] : [36, 84]; }
function drawKeys() {
  const [KB_LO, KB_HI] = kbBounds();
  kbRange = KB_LO + '-' + KB_HI;
  const wrap = document.getElementById('kb-keys');
  const whites = [];
  for (let m = KB_LO; m <= KB_HI; m++) if (!BLACK.has(m % 12)) whites.push(m);
  const ww = 100 / whites.length;
  let h = '';
  whites.forEach((m, i) => {
    h += `<button type="button" class="key white" data-midi="${m}" style="left:${i * ww}%;width:${ww}%" aria-label="${SHARP_NAMES[m % 12]}${Math.floor(m / 12) - 1}">`
      + `<span class="kl"></span>${m % 12 === 0 ? `<span class="oct">C${m / 12 - 1}</span>` : ''}</button>`;
    if (BLACK.has((m + 1) % 12) && m + 1 <= KB_HI)
      h += `<button type="button" class="key black" data-midi="${m + 1}" style="left:${(i + 1) * ww - ww * 0.31}%;width:${ww * 0.62}%" aria-label="${SHARP_NAMES[(m + 1) % 12]}${Math.floor((m + 1) / 12) - 1}"></button>`;
  });
  wrap.innerHTML = h;
  kbKeys = {};
  wrap.querySelectorAll('.key').forEach(k => { kbKeys[k.dataset.midi] = k; });
}
function buildKeyboard() {
  drawKeys();
  const wrap = document.getElementById('kb-keys');
  window.addEventListener('resize', () => {
    const [lo, hi] = kbBounds();
    if (lo + '-' + hi !== kbRange) { drawKeys(); updateKeyboard(); }
  });
  wrap.addEventListener('pointerdown', e => {
    const k = e.target.closest('.key');
    if (!k) return;
    e.preventDefault();
    pluck(+k.dataset.midi);
  });
  let open = window.innerHeight >= 500;
  try { const v = localStorage.getItem('theoryKb'); if (v) open = v === 'open'; } catch (e) {}
  setKeyboardOpen(open, false);
}
function setKeyboardOpen(open, remember = true) {
  document.getElementById('kb').classList.toggle('closed', !open);
  const b = document.getElementById('kb-toggle');
  b.setAttribute('aria-expanded', String(open));
  if (remember) try { localStorage.setItem('theoryKb', open ? 'open' : 'closed'); } catch (e) {}
}
// Tint the current scale; label its notes on the keys.
function updateKeyboard() {
  const { t, notes } = currentScale();
  const byPc = {};
  notes.forEach(n => { byPc[pcOf(n.note)] = n; });
  for (const m in kbKeys) {
    const n = byPc[m % 12], k = kbKeys[m];
    k.classList.toggle('in', !!n);
    k.classList.toggle('root', !!n && n.deg === '1');
    const l = k.querySelector('.kl');
    if (l) l.textContent = n ? n.name : '';
    k.title = n ? n.name + ' (' + n.deg.replace('b', '♭').replace('#', '♯') + ')' : '';
  }
  document.getElementById('kb-label').textContent = nameOf(t) + ' ' + (S.mode === 'major' ? 'major' : S.minorType + ' minor') + ': ' + notes.map(n => n.name).join(' ');
}
function kbFlash(midi, delayMs, holdMs) {
  const k = kbKeys[midi];
  if (!k) return;
  setTimeout(() => {
    k.classList.add('on');
    clearTimeout(k._off);
    k._off = setTimeout(() => k.classList.remove('on'), holdMs || 380);
  }, Math.max(0, delayMs));
}


// Key dropdown in the keyboard bar: all 24 keys, spelled as on the wheel.
function updateKeySelect() {
  const sel = document.getElementById('key-select');
  const opts = [];
  for (let p = 0; p < 12; p++) opts.push({ p, mode: 'major', k: majorKeyAt(p) }, { p, mode: 'minor', k: minorKeyAt(p) });
  const sortKey = o => (pcOf(o.k) + 12 - 0) % 12;
  const group = mode => opts.filter(o => o.mode === mode).sort((a, b) => sortKey(a) - sortKey(b))
    .map(o => `<option value="${o.p}:${o.mode}"${o.p === S.pos && o.mode === S.mode ? ' selected' : ''}>${esc(keyName(o.k, o.mode))}</option>`).join('');
  sel.innerHTML = `<optgroup label="Major keys">${group('major')}</optgroup><optgroup label="Minor keys">${group('minor')}</optgroup>`;
}
// ── Start: key from the URL (#key=Eb or #key=F#m), else C major ──
function keyFromHash() {
  const m = decodeURIComponent(location.hash || '').match(/key=([A-G])([#b♯♭]?)(m?)/);
  if (!m) return;
  const l = LETTERS.indexOf(m[1]);
  const a = /[#♯]/.test(m[2]) ? 1 : /[b♭]/.test(m[2]) ? -1 : 0;
  const minor = !!m[3];
  for (let pos = 0; pos < 12; pos++) {
    for (const alt of [false, true]) {
      if (alt && !MAJOR_ALT[pos]) continue;
      S.alt[pos] = alt;
      const k = minor ? minorKeyAt(pos) : majorKeyAt(pos);
      if (k[0] === l && k[1] === a) { S.pos = pos; S.rot = -pos * 30; S.mode = minor ? 'minor' : 'major'; return; }
    }
    S.alt[pos] = false;
  }
}

buildWheel();
buildKeyboard();
buildCards();
LAYOUT = loadLayout();
placeCards();
applyCollapsed();
let savedTheme = 'dark';
try { savedTheme = localStorage.getItem('fbTheme') || 'dark'; } catch (e) {}
setTheme(savedTheme !== 'light');
keyFromHash();
render();
</script>
</body>
